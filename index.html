<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speakeng Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17233B;
    --cream:#FFF8ED;
    --mango:#FFB000;
    --coral:#FF6B5E;
    --teal:#36B8A5;
    --mint:#D8F5E8;
    --blue:#4D7CFE;
    --violet:#8B6BFF;
    --paper:#FFFFFF;
    --line: rgba(23,35,59,0.10);
    --shadow: 0 10px 30px rgba(23,35,59,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--cream);
    color: var(--ink);
    font-family:'Manrope', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2', 'Manrope', sans-serif;
    margin:0;
    color: var(--ink);
    line-height:1.15;
  }
  button{ font-family: inherit; cursor:pointer; border:none; background:none; }
  textarea{ font-family:inherit; }
  .app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--cream);
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom: 84px;
  }
  @media (min-width: 860px){
    .app{
      max-width: 1080px;
      min-height: 100vh;
      display:grid;
      grid-template-columns: 220px 1fr 280px;
      gap:0;
      padding-bottom:0;
    }
    .app.onboarding-mode{ display:block; max-width:480px; }
    .app.wide-mode{ grid-template-columns: 220px 1fr; }
    .app.wide-mode .side-panel{ display:none !important; }
    .sidebar{ display:flex !important; }
    .bottomnav{ display:none !important; }
    .main-col{ border-left:1px solid var(--line); border-right:1px solid var(--line); }
    .side-panel{ display:flex !important; }
  }
  .sidebar{
    display:none;
    flex-direction:column;
    padding:28px 18px;
    gap:6px;
  }
  .sidebar .brand{ display:flex; align-items:center; gap:10px; margin-bottom:28px; padding:0 10px;}
  .sidebar .brand .mark{ width:34px;height:34px; }
  .sidebar .brand span{ font-family:'Baloo 2'; font-weight:700; font-size:18px; }
  .sidebar button{
    text-align:left; padding:11px 14px; border-radius:14px; font-weight:700; font-size:14.5px;
    color: var(--ink); opacity:0.55; display:flex; align-items:center; gap:10px;
  }
  .sidebar button.active{ background: var(--paper); opacity:1; box-shadow: var(--shadow); color:var(--coral); }
  .side-panel{
    display:none;
    flex-direction:column;
    padding:28px 20px;
    gap:18px;
  }
  .main-col{ padding: 0; min-height:100vh; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 8px;
  }
  .pill{
    display:flex; align-items:center; gap:6px;
    background: var(--paper); border-radius:100px; padding:6px 12px;
    font-weight:800; font-size:13.5px; box-shadow: var(--shadow);
  }
  .pill.streak{ color:#D9540A; }
  .pill.coins{ color:#B8860B; }
  .pill.role{ color:var(--violet); }

  .screen{ padding: 4px 20px 20px; animation: fadein .35s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  /* ---------- Onboarding / Auth ---------- */
  .ob-wrap{ min-height:100vh; display:flex; flex-direction:column; justify-content:space-between; padding:32px 24px; }
  .ob-mascot{ text-align:center; margin: 10px 0 6px; }
  .brand-word{ font-family:'Baloo 2'; font-weight:800; font-size:34px; color:var(--ink); margin: 6px 0 4px; }
  .brand-word.small{ font-size:20px; margin:0; }
  .brand-tag{ font-size:14px; color:#7a6a4a; font-weight:600; margin-bottom:6px; }
  .ob-card h2{ font-size:24px; font-weight:700; margin-bottom:6px; }
  .ob-mr{ color:#6B5B3A; font-size:15px; margin-bottom:22px; }
  .ob-options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    background: var(--paper); border:2px solid transparent; border-radius:16px;
    padding:15px 16px; font-weight:700; font-size:15px; text-align:left;
    box-shadow: var(--shadow); transition: transform .12s ease, border-color .12s ease;
  }
  .opt .mr{ display:block; font-weight:500; font-size:12.5px; color:#7a6a4a; margin-top:2px; }
  .opt:active{ transform: scale(0.98); }
  .opt.selected{ border-color: var(--coral); background: #FFF0EE; }
  .opt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .ob-input{
    width:100%; padding:15px 16px; border-radius:16px; border:2px solid var(--line);
    font-size:16px; font-weight:600; font-family:inherit; background:var(--paper);
  }
  .ob-input:focus{ outline:none; border-color: var(--coral); }
  .btn{
    padding:16px 20px; border-radius:16px; font-weight:800; font-size:15.5px;
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  }
  .btn-primary{ background: var(--coral); color:white; box-shadow: 0 8px 20px rgba(255,107,94,0.35); }
  .btn-primary:disabled{ opacity:0.35; }
  .btn-primary:active{ transform: scale(0.98); }
  .btn-ghost{ background: transparent; color: var(--ink); opacity:0.55; font-weight:700; }
  .btn-sm{ padding:10px 14px; font-size:13px; width:auto; border-radius:12px; }
  .btn-teal{ background: var(--teal); color:white; }
  .btn-blue{ background: var(--blue); color:white; }
  .ob-progress{ display:flex; gap:6px; margin-bottom:20px; }
  .ob-progress i{ flex:1; height:5px; border-radius:4px; background: var(--line); }
  .ob-progress i.done{ background: var(--coral); }

  /* ---------- Home ---------- */
  .greet{ font-size:22px; font-weight:700; margin:10px 0 2px; }
  .greet-mr{ color:#7a6a4a; font-size:13.5px; margin-bottom:18px; }
  .continue-card{
    background: linear-gradient(135deg, var(--ink), #23345a);
    border-radius:22px; padding:20px; color:white; position:relative; overflow:hidden; margin-bottom:18px;
  }
  .continue-card .tag{ font-size:12px; font-weight:700; color:var(--mango); margin-bottom:6px; }
  .continue-card h3{ color:white; font-size:19px; margin-bottom:4px; }
  .continue-card p{ margin:0 0 16px; font-size:13px; color:#C9D2E5; }
  .continue-card button{
    background: var(--mango); color:var(--ink); font-weight:800; padding:11px 18px; border-radius:100px; font-size:14px;
  }
  .section-title{ font-weight:800; font-size:15px; margin: 22px 0 12px; display:flex; align-items:center; justify-content:space-between; }
  .revise-strip{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
  .revise-chip{ flex:0 0 auto; background:#FFF3DC; border-radius:14px; padding:10px 14px; font-weight:700; font-size:12.5px; color:#8a5a00; white-space:nowrap; }

  .module-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .module-card{ background: var(--paper); border-radius:18px; padding:14px; box-shadow: var(--shadow); position:relative; text-align:left; }
  .module-card.locked{ opacity:0.45; }
  .module-card .mic{ font-size:24px; }
  .module-card .mtag{ font-size:9.5px; font-weight:800; color:var(--coral); text-transform:uppercase; letter-spacing:.03em; margin-top:6px; }
  .module-card .mtitle{ font-weight:800; font-size:13.5px; margin-top:2px; line-height:1.2; }
  .module-card .mmeta{ font-size:11px; opacity:0.55; margin-top:6px; font-weight:700; }
  .ring{ width:30px; height:30px; border-radius:50%; position:absolute; top:12px; right:12px; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; }

  .bottomnav{
    position:fixed; bottom:0; left:0; right:0; background: var(--paper);
    border-top:1px solid var(--line); display:flex; z-index:30;
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .app{ position:relative; }
  .bottomnav-inner{ max-width:480px; margin:0 auto; display:flex; width:100%; }
  .navbtn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; font-size:10.5px; font-weight:700; opacity:0.45; }
  .navbtn.active{ opacity:1; color:var(--coral); }
  .navbtn .ic{ font-size:19px; }

  /* ---------- Lesson ---------- */
  .lesson-top{ display:flex; align-items:center; gap:12px; padding:16px 20px 6px; }
  .close-x{ font-size:20px; opacity:0.5; }
  .lesson-bar{ flex:1; height:10px; background: var(--line); border-radius:10px; overflow:hidden; }
  .lesson-bar i{ display:block; height:100%; background: var(--teal); border-radius:10px; transition: width .3s ease; }
  .lesson-card{ background: var(--paper); border-radius:22px; padding:24px 20px; margin:18px 20px; box-shadow: var(--shadow); }
  .mr-line{ font-size:16px; color:#5a4a2a; margin-bottom:10px; font-weight:600; }
  .en-line{ font-size:23px; font-weight:800; margin-bottom:16px; }
  .listen-btn{ display:inline-flex; align-items:center; gap:8px; background: var(--mint); color:#116655; padding:10px 16px; border-radius:100px; font-weight:800; font-size:13.5px; }
  .hint{ margin-top:16px; font-size:12.5px; color:#8a7a5a; background: #FFF3DC; padding:10px 12px; border-radius:12px; }
  .word-bank{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; min-height:40px; }
  .word-chip{ background: var(--paper); border:2px solid var(--line); border-radius:12px; padding:9px 14px; font-weight:700; font-size:14.5px; }
  .word-chip.used{ opacity:0.25; pointer-events:none; }
  .answer-slot{ display:flex; flex-wrap:wrap; gap:8px; min-height:44px; border-bottom:2px dashed var(--line); padding-bottom:14px; margin-bottom:16px; }
  .answer-chip{ background: var(--mint); border-radius:12px; padding:9px 14px; font-weight:700; font-size:14.5px; }
  .mic-btn{
    width:84px; height:84px; border-radius:50%; background: var(--coral); color:white; font-size:30px;
    display:flex; align-items:center; justify-content:center; margin: 8px auto 6px; box-shadow: 0 10px 24px rgba(255,107,94,0.35);
  }
  .mic-btn.listening{ animation: pulse 1.1s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(255,107,94,0.5);} 70%{box-shadow:0 0 0 18px rgba(255,107,94,0);} 100%{box-shadow:0 0 0 0 rgba(255,107,94,0);} }
  .feedback-box{ text-align:center; padding:14px; border-radius:16px; margin-top:14px; font-weight:700; font-size:14.5px; }
  .feedback-box.good{ background: var(--mint); color:#116655; }
  .feedback-box.retry{ background:#FFF0EE; color:#B5453A; }
  .type-fallback{ width:100%; margin-top:14px; padding:13px 14px; border-radius:14px; border:2px solid var(--line); font-family:inherit; font-size:14.5px; }
  .mcq-opt{ width:100%; text-align:left; background: var(--paper); border:2px solid var(--line); border-radius:14px; padding:13px 14px; font-weight:700; font-size:14.5px; margin-bottom:9px; }
  .mcq-opt.correct{ border-color: var(--teal); background: var(--mint); }
  .mcq-opt.wrong{ border-color: var(--coral); background:#FFF0EE; }
  .vocab-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px; }
  .vocab-item{ background:var(--mint); border-radius:12px; padding:10px; }
  .vocab-item .en{ font-weight:800; font-size:13.5px; }
  .vocab-item .mr{ font-size:11.5px; opacity:0.7; margin:0; }
  .vocab-item .sp{ float:right; font-size:13px; }
  .scene-emoji{ font-size:48px; text-align:center; margin-bottom:6px; letter-spacing:6px; }
  .timer-num{ font-family:'Baloo 2'; font-size:40px; font-weight:800; text-align:center; margin:10px 0; }
  .write-box{ width:100%; min-height:120px; border-radius:14px; border:2px solid var(--line); padding:14px; font-size:14.5px; margin-top:12px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{ background:#FFF3DC; color:#8a5a00; font-weight:700; font-size:11.5px; padding:6px 10px; border-radius:100px; }
  .dlg-line{ margin-bottom:12px; }
  .dlg-who{ font-size:11px; font-weight:800; opacity:0.5; margin-bottom:3px; }
  .dlg-txt{ font-weight:700; font-size:14.5px; }
  .dlg-txt.user{ color:var(--coral); }

  /* completion */
  .complete-wrap{ text-align:center; padding: 40px 24px; }
  .stars-row{ font-size:40px; margin: 18px 0 6px; letter-spacing:6px; }
  .reward-grid{ display:flex; justify-content:center; gap:14px; margin:22px 0; flex-wrap:wrap; }
  .reward-chip{ background: var(--paper); border-radius:16px; padding:14px 18px; box-shadow: var(--shadow); min-width:88px; }
  .reward-chip .n{ font-weight:800; font-size:20px; }
  .reward-chip .l{ font-size:11px; opacity:0.6; font-weight:700; }
  .adapt-note{ font-size:12.5px; font-weight:700; color:var(--violet); background:#F1EDFF; padding:10px 14px; border-radius:12px; margin-top:10px; }

  /* progress screen */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0; }
  .stat-card{ background: var(--paper); border-radius:18px; padding:16px; box-shadow: var(--shadow); }
  .stat-card .n{ font-size:24px; font-weight:800; }
  .stat-card .l{ font-size:12px; opacity:0.6; font-weight:700; }
  .badge-grid{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
  .badge{ background: var(--paper); border-radius:16px; padding:14px; text-align:center; width:92px; box-shadow: var(--shadow); }
  .badge.locked{ opacity:0.3; }
  .badge .ic{ font-size:26px; }
  .badge .l{ font-size:10.5px; font-weight:700; margin-top:4px; }
  .week-row{ display:flex; gap:6px; margin-top:6px; }
  .week-day{ flex:1; aspect-ratio:1; border-radius:10px; background: var(--paper); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; box-shadow: var(--shadow); }
  .week-day.done{ background: var(--mango); color:white; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .bar-row .lbl{ width:120px; font-size:11.5px; font-weight:700; opacity:0.7; flex-shrink:0; }
  .bar-track{ flex:1; height:10px; background:var(--line); border-radius:10px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--teal); border-radius:10px; }

  .card{ background: var(--paper); border-radius:20px; padding:18px; box-shadow: var(--shadow); margin-bottom:14px; }
  .empty-note{ font-size:13px; color:#8a7a5a; }
  a.link{ color: var(--blue); font-weight:700; text-decoration:none; }
  .row-item{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); }
  .row-item:last-child{ border-bottom:none; }
  .row-item .name{ font-weight:800; font-size:14px; }
  .row-item .sub{ font-size:11.5px; opacity:0.55; font-weight:600; }
  .rank-num{ width:26px; height:26px; border-radius:50%; background:var(--mint); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; margin-right:10px; }
  .lb-row{ display:flex; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .lb-row:last-child{ border-bottom:none; }
  .alert-card{ border-radius:16px; padding:12px 14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .alert-card.inactivity{ background:#FFF3DC; }
  .alert-card.struggle{ background:#FFF0EE; }
  .alert-card .at{ font-weight:800; font-size:13px; }
  .alert-card .am{ font-size:11.5px; opacity:0.65; font-weight:600; }
  .tag-role{ display:inline-block; font-size:10px; font-weight:800; text-transform:uppercase; padding:3px 8px; border-radius:100px; background:var(--mint); color:#116655; letter-spacing:.03em; }
  select.ob-input{ appearance:none; }
  .small-note{ font-size:11.5px; opacity:0.55; margin-top:6px; font-weight:600; }
</style>
</head>

   HELPERS
================================================================= */
function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function normalize(s){ return (s||'').toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim(); }
function wordMatchScore(heard, target){
  const h = new Set(normalize(heard).split(' ').filter(Boolean));
  const t = normalize(target).split(' ').filter(Boolean);
  if(!t.length) return 0;
  const hit = t.filter(w=>h.has(w)).length;
  return Math.round((hit/t.length)*100);
}
function keywordScore(heard, keywords){
  const h = normalize(heard);
  if(!keywords || !keywords.length) return h.length>3 ? 70 : 0;
  const hit = keywords.filter(k=>h.includes(normalize(k))).length;
  return Math.round((hit/keywords.length)*100);
}
function countFillers(text){
  const h = ' ' + normalize(text) + ' ';
  const fillers = ['um','uh','like','you know','so','actually'];
  return fillers.reduce((n,f)=> n + (h.split(' '+f+' ').length-1), 0);
}
function wpm(text, seconds){
  const words = normalize(text).split(' ').filter(Boolean).length;
  if(!seconds) return 0;
  return Math.round(words / (seconds/60));
}
function writingScore(text, requiredWords){
  const words = text.trim().split(/\s+/).filter(Boolean);
  let score = 0;
  if(words.length>=20) score+=30; else score += Math.round((words.length/20)*30);
  if(/^[A-Z]/.test(text.trim())) score+=10;
  if(/[.!?]\s*$/.test(text.trim())) score+=10;
  const h = normalize(text);
  const hits = (requiredWords||[]).filter(w=>h.includes(normalize(w))).length;
  score += Math.round((hits/Math.max(1,(requiredWords||[]).length))*50);
  return Math.min(100, score);
}
function speak(text, rate){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate = rate || 0.92;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}
function levelIndex(lvl){ return Math.max(0, LEVELS.indexOf(lvl||'Foundation')); }

  const { data, error } = await supabase.from('profiles').update(fields).eq('id', profile.id).select().maybeSingle();

    supabase.from('daily_activity').select('*').eq('student_id', profile.id).order('activity_date', {ascending:false}).limit(60),

function lastAttemptFor(moduleKey){ return myProgress.find(r=>r.module_key===moduleKey) || null; }
function attemptCount(moduleKey){ return myProgress.filter(r=>r.module_key===moduleKey).length; }

async function saveAttempt({moduleKey, itemIndex, score, xp, stars, seconds, fillers, meta}){
  await supabase.from('module_progress').insert({
    student_id: profile.id, module_key: moduleKey, item_index: itemIndex,
    score, xp_earned: xp, stars, speaking_seconds: seconds||0, filler_words: fillers||0, meta: meta||{}
  });
  const today = todayStr();
  const { data: existing } = await supabase.from('daily_activity').select('*').eq('student_id', profile.id).eq('activity_date', today).maybeSingle();
  if(existing){
    const touched = new Set(existing.modules_touched||[]); touched.add(moduleKey);
    await supabase.from('daily_activity').update({
      speaking_seconds: existing.speaking_seconds + (seconds||0),
      xp_earned: existing.xp_earned + xp,
      modules_touched: Array.from(touched)
    }).eq('id', existing.id);
  } else {
    await supabase.from('daily_activity').insert({ student_id: profile.id, activity_date: today, speaking_seconds: seconds||0, xp_earned: xp, modules_touched:[moduleKey] });
  }
  let newStreak = profile.streak;
  if(profile.last_practice_date !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = y.toISOString().slice(0,10);
    newStreak = (profile.last_practice_date === yesterday) ? profile.streak + 1 : 1;
  }
  await updateProfile({
    xp: profile.xp + xp, coins: profile.coins + Math.round(xp/4), stars: profile.stars + stars,
    streak: newStreak, last_practice_date: today
  });
  await checkAndAwardBadges();
  await loadStudentData();
}
async function checkAndAwardBadges(){
  const have = new Set(myBadges.map(b=>b.badge_key));
  const [{data:allProg}] = await Promise.all([ supabase.from('module_progress').select('module_key,completed_at').eq('student_id', profile.id) ]);
  const rows = allProg || [];
  const toAward = [];
  if(rows.length>=1 && !have.has('first')) toAward.push('first');
  if(profile.streak>=3 && !have.has('streak3')) toAward.push('streak3');
  if(profile.streak>=7 && !have.has('streak7')) toAward.push('streak7');
  if(new Set(rows.map(r=>r.module_key)).size>=8 && !have.has('allmods')) toAward.push('allmods');
  if(rows.filter(r=>r.module_key==='m7').length>=5 && !have.has('writer')) toAward.push('writer');
  if(rows.filter(r=>r.module_key==='m6').length>=5 && !have.has('speaker')) toAward.push('speaker');
  if(rows.filter(r=>r.module_key==='m8').length>=1 && !have.has('capstone')) toAward.push('capstone');
  for(const key of toAward){
    await supabase.from('badges').insert({ student_id: profile.id, badge_key: key }).select();
  }
}

async function loadMentorData(){
  const { data } = await supabase.from('profiles').select('*').eq('mentor_id', profile.id).eq('role','student');
  mentorStudents = data || [];
  for(const s of mentorStudents){
    const [{data:act}, {data:prog}] = await Promise.all([
      supabase.from('daily_activity').select('activity_date').eq('student_id', s.id).order('activity_date',{ascending:false}).limit(1),
      supabase.from('module_progress').select('score').eq('student_id', s.id).order('completed_at',{ascending:false}).limit(5),
    ]);
    s._lastActive = act && act[0] ? act[0].activity_date : null;
    s._avgScore = prog && prog.length ? Math.round(prog.reduce((a,r)=>a+r.score,0)/prog.length) : null;
    const daysSince = s._lastActive ? Math.floor((Date.now() - new Date(s._lastActive).getTime())/86400000) : 999;
    s._alerts = [];
    if(daysSince>=3) s._alerts.push({type:'inactivity', msg: s._lastActive ? `Inactive for ${daysSince} days` : 'No activity yet'});
    if(s._avgScore!==null && s._avgScore<60) s._alerts.push({type:'struggle', msg:`Recent average score ${s._avgScore}%`});
  }
}
async function loadAdminData(){
  const [{data:cohorts}, {data:students}] = await Promise.all([

    supabase.from('profiles').select('*').eq('role','student'),
  ]);
  adminCohorts = cohorts || [];
  adminStudents = students || [];
  for(const s of adminStudents){
    const [{data:act}, {data:prog}] = await Promise.all([
      supabase.from('daily_activity').select('activity_date').eq('student_id', s.id).order('activity_date',{ascending:false}).limit(1),
      supabase.from('module_progress').select('score,module_key').eq('student_id', s.id).order('completed_at',{ascending:false}).limit(5),
    ]);
    s._lastActive = act && act[0] ? act[0].activity_date : null;
    s._avgScore = prog && prog.length ? Math.round(prog.reduce((a,r)=>a+r.score,0)/prog.length) : null;
    const daysSince = s._lastActive ? Math.floor((Date.now() - new Date(s._lastActive).getTime())/86400000) : 999;
    s._atRisk = daysSince>=3 || (s._avgScore!==null && s._avgScore<60);
  }
  adminCohorts.forEach(c=>{
    const in_c = adminStudents.filter(s=>s.cohort_id===c.id);
    c._count = in_c.length;
    c._avgXp = in_c.length ? Math.round(in_c.reduce((a,s)=>a+s.xp,0)/in_c.length) : 0;

async function loadParentData(){

  const ids = (links||[]).map(l=>l.student_id);
  if(!ids.length){ parentChildren = []; return; }
  const { data: kids } = await supabase.from('profiles').select('*').in('id', ids);
  parentChildren = kids || [];
  const since = new Date(); since.setDate(since.getDate()-7);
  const sinceStr = since.toISOString().slice(0,10);
  for(const kid of parentChildren){
    const [{data:acts}, {data:badges}] = await Promise.all([
      supabase.from('daily_activity').select('*').eq('student_id', kid.id).gte('activity_date', sinceStr),
      supabase.from('badges').select('*').eq('student_id', kid.id).gte('earned_at', since.toISOString()),
    ]);
    const a = acts || [];
    parentDigests[kid.id] = {
      minutes: Math.round(a.reduce((s,r)=>s+r.speaking_seconds,0)/60),
      xp: a.reduce((s,r)=>s+r.xp_earned,0),
      daysActive: a.length,
      modules: new Set(a.flatMap(r=>r.modules_touched||[])).size,
      newBadges: badges || [],
    };
  }
}

async function routeAfterAuth(){
  if(profile.role==='student'){
    if(!profile.onboarded){ screen='onboarding'; obStep=0; obDraft={ name: profile.name||'' }; render(); return; }
    await loadStudentData();
    screen='home'; render();
  } else if(profile.role==='mentor'){
    await loadMentorData(); screen='mentor'; render();
  } else if(profile.role==='admin'){
    await loadAdminData(); screen='admin'; render();
  } else if(profile.role==='parent'){
    await loadParentData(); screen='parent'; render();
  }
}

function render(){
  const app = document.getElementById('app');
  const chromeless = ['loading','landing','auth','onboarding','diagnostic','lesson','emailcheck'].includes(screen);
  app.classList.toggle('onboarding-mode', chromeless);
  app.classList.toggle('wide-mode', profile && profile.role!=='student');
  let body = '';
  if(screen==='loading') body = '';
  else if(screen==='landing') body = renderLanding();
  else if(screen==='auth') body = renderAuth();
  else if(screen==='emailcheck') body = renderEmailCheck();
  else if(screen==='onboarding') body = renderOnboarding();
  else if(screen==='diagnostic') body = renderDiagnostic();
  else if(screen==='home') body = shell(renderHome(), 'home');
  else if(screen==='lesson') body = renderLesson();
  else if(screen==='leaderboard') body = shell(renderLeaderboard(), 'leaderboard');
  else if(screen==='progress') body = shell(renderProgress(), 'progress');
  else if(screen==='profile') body = shell(renderProfile(), 'profile');
  else if(screen==='mentor') body = shell(renderMentor(), 'mentor');
  else if(screen==='admin') body = shell(renderAdmin(), 'admin');
  else if(screen==='adminManage') body = shell(renderAdminManage(), 'adminManage');
  else if(screen==='parent') body = shell(renderParent(), 'parent');
  app.innerHTML = body;
  attachHandlers();
}

function navSetFor(role){
  if(role==='student') return [{k:'home',l:'Learn',i:'📘'},{k:'leaderboard',l:'Ranks',i:'🏅'},{k:'progress',l:'Progress',i:'📈'},{k:'profile',l:'Profile',i:'👤'}];
  if(role==='mentor') return [{k:'mentor',l:'Dashboard',i:'🧑‍🏫'},{k:'profile',l:'Profile',i:'👤'}];
  if(role==='admin') return [{k:'admin',l:'Overview',i:'🏛️'},{k:'adminManage',l:'Manage',i:'⚙️'},{k:'profile',l:'Profile',i:'👤'}];
  if(role==='parent') return [{k:'parent',l:'Digest',i:'📨'},{k:'profile',l:'Profile',i:'👤'}];
  return [];
}
function shell(inner, activeNav){

async function handleSignup(){
  const name = authDraft.name.trim(), email = authDraft.email.trim().toLowerCase(), pass = authDraft.password;
  if(!name || !email || !pass){ authError='Please fill in every field.'; render(); return; }
  if(!email.includes('@')){ authError='Enter a valid email.'; render(); return; }
  if(pass.length<6){ authError='Password should be at least 6 characters.'; render(); return; }
  signupPending = true; render();
  const { data, error } = await supabase.auth.signUp({ email, password: pass, options:{ data:{ name, role: authDraft.role } } });
  signupPending = false;
  if(error){ authError = error.message; render(); return; }
  if(data.session){
    session = data.session;
    profile = await fetchProfile(data.user.id);
    if(profile.role!=='student') await updateProfile({ onboarded:true });
    authError='';
    await routeAfterAuth();
  } else {
    screen = 'emailcheck'; render();
  }
}
async function handleLogin(){
  const email = authDraft.email.trim().toLowerCase(), pass = authDraft.password;
  if(!email || !pass){ authError='Enter your email and password.'; render(); return; }
  signupPending = true; render();
  const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
  signupPending = false;
  if(error){ authError = error.message; render(); return; }
  session = data.session;
  profile = await fetchProfile(data.user.id);
  authError='';
  await routeAfterAuth();
}

function renderDiagnostic(){
  let inner = '';
  if(diag.step < DIAGNOSTIC.vocab.length){
    const q = DIAGNOSTIC.vocab[diag.step];
    inner = `<div class="ob-card"><h2>What does "${q.en}" mean?</h2><div class="ob-mr">शब्दसंग्रह तपासणी — प्रश्न ${diag.step+1}/${DIAGNOSTIC.vocab.length}</div>
      <div class="ob-options">${q.options.map((o,i)=>`<button class="opt" data-vocab="${i}">${o}</button>`).join('')}</div></div>`;
  } else if(diag.step === DIAGNOSTIC.vocab.length){
    inner = `<div class="ob-card"><h2>Listening check</h2><div class="ob-mr">ऐकून प्रश्नाचं उत्तर द्या</div>
      <button class="listen-btn" id="diag-listen">🔊 Listen · ऐका</button>
      <div class="ob-options" style="margin-top:16px;">
        <div style="font-weight:700; margin-bottom:8px;">${DIAGNOSTIC.listen.q}</div>
        ${DIAGNOSTIC.listen.options.map((o,i)=>`<button class="opt" data-listen="${i}">${o}</button>`).join('')}
      </div></div>`;
  } else {
    const supportsSpeech = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    inner = `<div class="ob-card" style="text-align:center;"><h2>Speaking check</h2><div class="ob-mr">वाक्य वाचून दाखवा</div>
      <div class="en-line" style="font-size:19px;">${DIAGNOSTIC.speak.target}</div>
      ${supportsSpeech ? `<button class="mic-btn ${recognizing?'listening':''}" id="diag-mic">🎤</button><div style="font-size:12px; opacity:0.6;">${recognizing?'ऐकत आहे...':'Tap and speak'}</div>` : `<div class="hint">No mic support here — type it instead.</div>`}
      <input class="type-fallback" id="diag-type" placeholder="Or type the sentence..." />
      ${diag.speakResult ? `<div class="feedback-box good">Got it, thanks!</div>` : ''}
      </div>`;
  }
  return `<div class="ob-wrap"><div><div class="ob-progress"><i class="done"></i><i class="done"></i><i class="done"></i></div>${inner}</div>
    <div>${diag.step>=DIAGNOSTIC.vocab.length+1 ? `<button id="diag-finish" class="btn btn-primary" ${diag.speakResult?'':'disabled'}>See my level · माझी पातळी पहा</button>` : ''}</div></div>`;
}
function attachDiagnosticHandlers(){
  document.querySelectorAll('[data-vocab]').forEach(b=> b.onclick = ()=>{
    diag.vocabAnswers.push(parseInt(b.dataset.vocab));
    diag.step++; render();
  });
  const listenBtn = document.getElementById('diag-listen');
  if(listenBtn) listenBtn.onclick = ()=> speak(DIAGNOSTIC.listen.sentence);
  document.querySelectorAll('[data-listen]').forEach(b=> b.onclick = ()=>{
    diag.listenAnswer = parseInt(b.dataset.listen);
    diag.step++; render();
  });
  const micBtn = document.getElementById('diag-mic');
  if(micBtn) micBtn.onclick = ()=>{
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new Rec(); rec.lang='en-US'; recognizing=true; render();
    rec.onresult = (e)=>{ diag.speakTranscript = e.results[0][0].transcript; diag.speakResult='ok'; recognizing=false; render(); };
    rec.onerror = ()=>{ recognizing=false; render(); };
    rec.onend = ()=>{ recognizing=false; };
    rec.start();
  };
  const typeInput = document.getElementById('diag-type');
  if(typeInput) typeInput.onkeydown = (e)=>{ if(e.key==='Enter'){ diag.speakTranscript = e.target.value; diag.speakResult='ok'; render(); } };
  const finishBtn = document.getElementById('diag-finish');
  if(finishBtn) finishBtn.onclick = finishDiagnostic;
}
async function finishDiagnostic(){
  const vocabCorrect = diag.vocabAnswers.filter((a,i)=>a===DIAGNOSTIC.vocab[i].correct).length;
  const vocabScore = Math.round((vocabCorrect/DIAGNOSTIC.vocab.length)*100);
  const listenScore = diag.listenAnswer===DIAGNOSTIC.listen.correct ? 100 : 30;
  const speakScore = wordMatchScore(diag.speakTranscript, DIAGNOSTIC.speak.target);
  const composite = Math.round((vocabScore+listenScore+speakScore)/3);
  let level = 'Foundation';
  if(composite>=90) level='A3+'; else if(composite>=75) level='A3'; else if(composite>=60) level='A2'; else if(composite>=40) level='A1';
  await supabase.from('diagnostics').insert({ student_id: profile.id, speak_score:speakScore, vocab_score:vocabScore, listen_score:listenScore, level_assigned:level });
  await updateProfile({
    name: obDraft.name.trim(), department: obDraft.department, mother_tongue: obDraft.langHelp,
    goal: obDraft.goal, level, onboarded:true
  });
  await loadStudentData();
  screen='home'; render();
}

function openModule(key){
  const mod = MODULES.find(m=>m.key===key);
  if(mod.lockLevel && levelIndex(profile.level) < mod.lockLevel){ return; }
  activeModuleKey = key;
  const idx = attemptCount(key);
  const recent = myProgress.filter(r=>r.module_key===key).slice(0,3).map(r=>r.score);
  const avg = recent.length ? recent.reduce((a,b)=>a+b,0)/recent.length : 50;
  let nextIndex = idx;
  if(avg>=85) nextIndex = idx+1;
  else if(avg<55 && idx>0) nextIndex = idx-1;
  lesson = { step:0, itemIndex: Math.max(0,nextIndex), transcript:'', result:null, data:{} };
  initModuleLesson(key);
  screen='lesson'; render();
}

/* =================================================================
   LESSON RUNNER (dispatches to per-module renderers)
================================================================= */
function renderLesson(){
  const mod = MODULES.find(m=>m.key===activeModuleKey);
  let body = '';
  if(activeModuleKey==='m1') body = renderM1();
  else if(activeModuleKey==='m2') body = renderM2();
  else if(activeModuleKey==='m3') body = renderM3();
  else if(activeModuleKey==='m4') body = renderM4();
  else if(activeModuleKey==='m5') body = renderM5();
  else if(activeModuleKey==='m6') body = renderM6();
  else if(activeModuleKey==='m7') body = renderM7();
  else if(activeModuleKey==='m8') body = renderM8();
  else if(activeModuleKey==='complete') body = renderCompletion();
  const pct = activeModuleKey==='complete' ? 100 : Math.round(((lesson.step||0)/3)*100);
  return `<div class="lesson-top"><button class="close-x" id="lesson-close">✕</button><div class="lesson-bar"><i style="width:${pct}%"></i></div></div>${body}`;
}
function initModuleLesson(key){
  if(key==='m1'){ const day = getVocabDay(lesson.itemIndex, profile.department); const item = READING_ITEMS[lesson.itemIndex % READING_ITEMS.length]; lesson.data = { day, item }; }
  else if(key==='m2'){ lesson.data.item = GRAMMAR_ITEMS[lesson.itemIndex % GRAMMAR_ITEMS.length]; lesson.data.bank = shuffle(lesson.data.item.words.map((w,i)=>({w,i,used:false}))); lesson.data.answer=[]; }
  else if(key==='m3'){ lesson.data.item = PRON_ITEMS[lesson.itemIndex % PRON_ITEMS.length]; }
  else if(key==='m4'){ lesson.data.item = PICTURE_ITEMS[lesson.itemIndex % PICTURE_ITEMS.length]; }
  else if(key==='m5'){ lesson.data.scenario = SCENARIOS[lesson.itemIndex % SCENARIOS.length]; lesson.data.turn = 0; lesson.data.hits = 0; lesson.data.userTurns = lesson.data.scenario.turns.filter(t=>t.isUser).length; }
  else if(key==='m6'){
    const n = attemptCount('m6'); const target = n<3?180:(n<6?300:600);
    lesson.data.topic = TOPIC_BANK[n % TOPIC_BANK.length]; lesson.data.target = target; lesson.data.elapsed=0; lesson.data.running=false; lesson.data.transcript='';
  }
  else if(key==='m7'){ lesson.data.item = WRITING_PROMPTS[lesson.itemIndex % WRITING_PROMPTS.length]; lesson.data.text=''; }
  else if(key==='m8'){ lesson.data.q = INTERVIEW_QUESTIONS[lesson.itemIndex % INTERVIEW_QUESTIONS.length]; lesson.data.gd = GD_TOPICS[lesson.itemIndex % GD_TOPICS.length]; lesson.data.partA=null; lesson.data.partB=null; }
}

/* --- shared mic helper --- */
function genericMic(onResult){
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Rec) return;
  const rec = new Rec(); rec.lang='en-US'; recognizing=true; render();
  rec.onresult = (e)=>{ recognizing=false; onResult(e.results[0][0].transcript); };
  rec.onerror = ()=>{ recognizing=false; render(); };
  rec.onend = ()=>{ recognizing=false; };
  rec.start();
}

/* --- completion + adaptive engine --- */
async function finishModule(score, extra){
  score = Math.max(0, Math.min(100, Math.round(score||0)));
  const base = { m1:20, m2:20, m3:18, m4:20, m5:22, m6:25, m7:18, m8:30 }[activeModuleKey] || 20;
  const xp = Math.round(base * (0.5 + score/200));
  const stars = score>=90?3:(score>=70?2:1);
  const recent = myProgress.filter(r=>r.module_key===activeModuleKey).slice(0,2).map(r=>r.score);
  const avg = recent.length ? (recent.reduce((a,b)=>a+b,0)+score)/(recent.length+1) : score;
  let adaptNote = '';
  if(avg>=85) adaptNote = "Great work — we'll raise the difficulty next time! 📈";
  else if(avg<55) adaptNote = "Let's practice a bit more at this level before moving on. 💪";
  lastEarned = { xp, stars, coins: Math.round(xp/4), adaptNote };
  await saveAttempt({ moduleKey: activeModuleKey, itemIndex: lesson.itemIndex, score, xp, stars, seconds: extra.seconds||0, fillers: extra.fillers||0, meta: extra });
  activeModuleKey = 'complete';
  render();
}
function renderCompletion(){
  return `<div class="complete-wrap">${MASCOT}
    <h2 style="font-size:22px; margin-top:12px;">छान! Module complete.</h2>
    <div class="stars-row">${'⭐'.repeat(lastEarned.stars)}${'☆'.repeat(3-lastEarned.stars)}</div>
    <div class="reward-grid">
      <div class="reward-chip"><div class="n">+${lastEarned.xp}</div><div class="l">XP</div></div>
      <div class="reward-chip"><div class="n">+${lastEarned.coins}</div><div class="l">COINS</div></div>
    </div>
    ${lastEarned.adaptNote ? `<div class="adapt-note">${lastEarned.adaptNote}</div>` : ''}
    <button class="btn btn-primary" style="margin-top:18px;" id="complete-home">Back to modules</button>
  </div>`;
}

/* =================================================================
   LEADERBOARD / PROGRESS / PROFILE (student)
================================================================= */
function renderLeaderboard(){
  return `<div class="topbar"><div></div></div><div class="screen">
    <h2 style="font-size:20px; margin-bottom:4px;">Cohort Leaderboard</h2>
    <div class="greet-mr" style="margin-bottom:14px;">Only students in your cohort are shown — cohort-safe ranking</div>
    <div class="card">
      ${leaderboard.length ? leaderboard.map((s,i)=>`<div class="lb-row"><div class="rank-num">${i+1}</div><div style="flex:1;"><div class="name">${escapeHtml(s.name || 'Student')}${s.id===profile.id?' (you)':''}</div><div class="sub">🔥 ${s.streak} day streak</div></div><div style="font-weight:800;">${s.xp} XP</div></div>`).join('') : `<div class="empty-note">You're not in a cohort yet — ask your Admin to add you to one to see the leaderboard.</div>`}
    </div>
  </div>`;
}
function renderProgress(){
  const totalMods = MODULES.length;
  const doneCount = new Set(myProgress.map(r=>r.module_key)).size;
  const days = ['S','M','T','W','T','F','S'];
  const today = new Date();
  const weekSet = new Set(myActivity.map(a=>a.activity_date));
  const weekCells = days.map((d,i)=>{ const dt=new Date(today); dt.setDate(today.getDate()-today.getDay()+i); const key=dt.toISOString().slice(0,10); return `<div class="week-day ${weekSet.has(key)?'done':''}">${d}</div>`; }).join('');
  const badgeSet = new Set(myBadges.map(b=>b.badge_key));
  const perModule = MODULES.map(m=>{ const rows = myProgress.filter(r=>r.module_key===m.key); const avg = rows.length ? Math.round(rows.reduce((a,r)=>a+r.score,0)/rows.length) : 0; return {m, avg}; });
  return `<div class="topbar"><div></div></div><div class="screen">
    <h2 style="font-size:20px; margin-bottom:14px;">Your Progress</h2>
    <div class="stat-grid">
      <div class="stat-card"><div class="n">${profile.xp}</div><div class="l">Total XP</div></div>
      <div class="stat-card"><div class="n">${profile.streak}</div><div class="l">Day Streak</div></div>
      <div class="stat-card"><div class="n">${doneCount}/${totalMods}</div><div class="l">Modules tried</div></div>
      <div class="stat-card"><div class="n">${profile.readiness_score||0}%</div><div class="l">Readiness score</div></div>
    </div>
    <div class="section-title">This week</div>
    <div class="week-row">${weekCells}</div>
    <div class="section-title">Module averages</div>
    <div class="card">${perModule.map(x=>`<div class="bar-row"><div class="lbl">${x.m.icon} ${x.m.tag}</div><div class="bar-track"><div class="bar-fill" style="width:${x.avg}%;"></div></div><div style="width:32px; text-align:right; font-size:11px; font-weight:800;">${x.avg}%</div></div>`).join('')}</div>
    <div class="section-title">Badges</div>
    <div class="badge-grid">${BADGE_DEFS.map(b=>`<div class="badge ${badgeSet.has(b.key)?'':'locked'}"><div class="ic">${b.ic}</div><div class="l">${b.label}</div></div>`).join('')}</div>
  </div>`;
}
function renderProfile(){
  return `<div class="topbar"><div></div></div><div class="screen">
    <h2 style="font-size:20px; margin-bottom:14px;">Profile</h2>
    <div class="card">
      <div style="font-weight:800; font-size:17px;">${escapeHtml(profile.name)}</div>
      <div style="font-size:13px; opacity:0.6; margin-top:2px;">${escapeHtml(session.user.email||'')}</div>
      <span class="tag-role" style="margin-top:8px; display:inline-block;">${profile.role}</span>
      ${profile.role==='student' ? `<div style="font-size:13px; opacity:0.6; margin-top:8px;">Level: ${profile.level} · Dept: ${escapeHtml(profile.department||'—')} · Goal: ${escapeHtml(profile.goal||'—')}</div>` : ''}
    </div>
    <div class="card"><div style="font-weight:700; margin-bottom:8px;">About this app</div>
      <div class="empty-note">Speech recognition uses your browser's built-in engine (Chrome/Edge work best) and needs microphone permission. Scoring is heuristic (word/keyword matching), not a certified assessment.</div>
    </div>
    <button class="btn btn-ghost" id="do-logout">Log out</button>
  </div>`;
}

/* =================================================================
   MENTOR DASHBOARD
================================================================= */
function renderMentor(){
  const alerts = mentorStudents.flatMap(s=> s._alerts.map(a=>({...a, student:s})));
  return `<div class="topbar"><div></div></div><div class="screen">
    <h2 style="font-size:20px; margin-bottom:4px;">Mentor Dashboard</h2>
    <div class="greet-mr" style="margin-bottom:14px;">${mentorStudents.length} students assigned to you</div>
    ${alerts.length ? `<div class="section-title" style="margin-top:0;">Alerts</div>${alerts.map(a=>`<div class="alert-card ${a.type}"><div><div class="at">${escapeHtml(a.student.name)}</div><div class="am">${a.msg}</div></div><button class="btn-sm btn-teal" data-view-student="${a.student.id}">View</button></div>`).join('')} ` : `<div class="card"><div class="empty-note">No alerts right now — everyone's on track. 🎉</div></div>`}
    <div class="section-title">Your students</div>
    <div class="card">
      ${mentorStudents.length ? mentorStudents.map(s=>`<div class="row-item"><div><div class="name">${escapeHtml(s.name)}</div><div class="sub">Level ${s.level||'—'} · 🔥 ${s.streak} · avg ${s._avgScore!==null?s._avgScore+'%':'—'}</div></div><button class="btn-sm btn-blue" data-view-student="${s.id}">Open</button></div>`).join('') : `<div class="empty-note">No students assigned yet — ask your Admin to assign students to you.</div>`}
    </div>
    ${mentorSelected ? renderMentorStudentDetail() : ''}
  </div>`;
}
function renderMentorStudentDetail(){
  const s = mentorSelected;
  return `<div class="card">
    <div class="section-title" style="margin-top:0;">${escapeHtml(s.name)}</div>
    <div class="empty-note" style="margin-bottom:10px;">Level ${s.level||'—'} · XP ${s.xp} · Streak ${s.streak} · Last active ${s._lastActive||'never'}</div>
    <div style="font-weight:700; margin-bottom:6px;">Give feedback / schedule a check-in</div>
    <textarea class="write-box" id="mentor-note" placeholder="Spoken feedback notes, encouragement, or check-in plan...">${escapeHtml(noteDraft)}</textarea>
    <button class="btn btn-primary" style="margin-top:10px;" id="mentor-save-note">Save note</button>
  </div>`;
}
function attachMentorHandlers(){
  document.querySelectorAll('[data-view-student]').forEach(b=> b.onclick = ()=>{
    mentorSelected = mentorStudents.find(s=>s.id===b.dataset.viewStudent);
    noteDraft = ''; render();
  });
  const noteArea = document.getElementById('mentor-note'); if(noteArea) noteArea.oninput = e=> noteDraft = e.target.value;
  const saveNote = document.getElementById('mentor-save-note'); if(saveNote) saveNote.onclick = async ()=>{
    if(!noteDraft.trim()) return;
    await supabase.from('mentor_notes').insert({ mentor_id: profile.id, student_id: mentorSelected.id, note: noteDraft.trim() });
    noteDraft=''; mentorSelected=null; render();
  };
}

/* =================================================================
   ADMIN DASHBOARD
================================================================= */
function renderAdmin(){
  const atRisk = adminStudents.filter(s=>s._atRisk);
  const totalStudents = adminStudents.length;
  const avgXp = totalStudents ? Math.round(adminStudents.reduce((a,s)=>a+s.xp,0)/totalStudents) : 0;
  const moduleAnalytics = MODULES.map(m=>({m, count: 0}));
  return `<div class="topbar"><div></div></div><div class="screen">
    <h2 style="font-size:20px; margin-bottom:14px;">Institute Overview</h2>
    <div class="stat-grid">
      <div class="stat-card"><div class="n">${totalStudents}</div><div class="l">Total students</div></div>
      <div class="stat-card"><div class="n">${adminCohorts.length}</div><div class="l">Cohorts</div></div>
      <div class="stat-card"><div class="n">${avgXp}</div><div class="l">Avg XP</div></div>
      <div class="stat-card"><div class="n">${atRisk.length}</div><div class="l">At-risk students</div></div>
    </div>
    <div class="section-title">Cohorts</div>
    <div class="card">${adminCohorts.length ? adminCohorts.map(c=>`<div class="row-item"><div><div class="name">${escapeHtml(c.name)}</div><div class="sub">${c._count} students · avg ${c._avgXp} XP</div></div></div>`).join('') : `<div class="empty-note">No cohorts yet — create one in Manage.</div>`}</div>
    <div class="section-title">At-risk list <span style="font-weight:600; opacity:0.5; font-size:12px;">inactive 3+ days or avg &lt;60%</span></div>
    <div class="card">${atRisk.length ? atRisk.map(s=>`<div class="row-item"><div><div class="name">${escapeHtml(s.name)}</div><div class="sub">Last active ${s._lastActive||'never'} · avg ${s._avgScore!==null?s._avgScore+'%':'—'}</div></div></div>`).join('') : `<div class="empty-note">Nobody is currently at risk. 🎉</div>`}</div>
    <div class="section-title">Content library — 8 modules</div>
    <div class="card">${MODULES.map(m=>`<div class="row-item"><div><div class="name">${m.icon} ${m.title}</div><div class="sub">${m.tag}</div></div></div>`).join('')}</div>
  </div>`;
}
function renderAdminManage(){
  return `<div class="topbar"><div></div></div><div class="screen">
    <h2 style="font-size:20px; margin-bottom:14px;">Manage</h2>
    <div class="card">
      <div style="font-weight:700; margin-bottom:8px;">Create a cohort</div>
      <input class="ob-input" id="mg-cohort" placeholder="Cohort name" value="${escapeHtml(manageDraft.cohortName)}" style="margin-bottom:10px;" />
      <button class="btn btn-primary" id="mg-create-cohort">Create cohort</button>
    </div>
    <div class="card">
      <div style="font-weight:700; margin-bottom:8px;">Assign a student to a cohort</div>
      <input class="ob-input" id="mg-student-email" placeholder="Student email" value="${escapeHtml(manageDraft.studentEmail)}" style="margin-bottom:10px;" />
      <select class="ob-input" id="mg-cohort-select" style="margin-bottom:10px;">
        <option value="">Choose cohort</option>
        ${adminCohorts.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
      </select>
      <button class="btn btn-teal" id="mg-assign-cohort">Assign to cohort</button>
    </div>
    <div class="card">
      <div style="font-weight:700; margin-bottom:8px;">Assign a mentor to a student</div>
      <input class="ob-input" id="mg-mentor-email" placeholder="Mentor email" value="${escapeHtml(manageDraft.mentorEmail)}" style="margin-bottom:10px;" />
      <input class="ob-input" id="mg-student-email2" placeholder="Student email" style="margin-bottom:10px;" />
      <button class="btn btn-teal" id="mg-assign-mentor">Assign mentor</button>
    </div>
    <div class="card">
      <div style="font-weight:700; margin-bottom:8px;">Link a parent to a student</div>
      <input class="ob-input" id="mg-parent-email" placeholder="Parent email" style="margin-bottom:10px;" />
      <input class="ob-input" id="mg-student-email3" placeholder="Student email" style="margin-bottom:10px;" />
      <button class="btn btn-teal" id="mg-link-parent">Link parent</button>
    </div>
    <div id="mg-status" class="empty-note"></div>
  </div>`;
}
function attachAdminManageHandlers(){
  const status = (msg)=>{ const el2 = document.getElementById('mg-status'); if(el2) el2.textContent = msg; };
  const cohortInput = document.getElementById('mg-cohort'); if(cohortInput) cohortInput.oninput = e=> manageDraft.cohortName = e.target.value;
  const createCohort = document.getElementById('mg-create-cohort'); if(createCohort) createCohort.onclick = async ()=>{
    if(!manageDraft.cohortName.trim()) return;
    const { error } = await supabase.from('cohorts').insert({ name: manageDraft.cohortName.trim(), admin_id: profile.id });
    status(error ? error.message : 'Cohort created.');
    manageDraft.cohortName=''; await loadAdminData(); render();
  };
  const assignCohortBtn = document.getElementById('mg-assign-cohort'); if(assignCohortBtn) assignCohortBtn.onclick = async ()=>{
    const email = document.getElementById('mg-student-email').value.trim().toLowerCase();
    const cohortId = document.getElementById('mg-cohort-select').value;
    if(!email || !cohortId) return;
    const { data: stu } = await supabase.from('profiles').select('id').eq('email', email).eq('role','student').maybeSingle();
    if(!stu){ status('No student found with that email.'); return; }
    await supabase.from('profiles').update({ cohort_id: cohortId }).eq('id', stu.id);
    status('Student assigned to cohort.'); await loadAdminData(); render();
  };
  const assignMentorBtn = document.getElementById('mg-assign-mentor'); if(assignMentorBtn) assignMentorBtn.onclick = async ()=>{
    const mEmail = document.getElementById('mg-mentor-email').value.trim().toLowerCase();
    const sEmail = document.getElementById('mg-student-email2').value.trim().toLowerCase();
    if(!mEmail || !sEmail) return;
    const { data: mentor } = await supabase.from('profiles').select('id').eq('email', mEmail).eq('role','mentor').maybeSingle();
    const { data: stu } = await supabase.from('profiles').select('id').eq('email', sEmail).eq('role','student').maybeSingle();
    if(!mentor || !stu){ status('Check both emails — mentor and student must already have accounts.'); return; }
    await supabase.from('profiles').update({ mentor_id: mentor.id }).eq('id', stu.id);
    status('Mentor assigned.'); await loadAdminData(); render();
  };
  const linkParentBtn = document.getElementById('mg-link-parent'); if(linkParentBtn) linkParentBtn.onclick = async ()=>{
    const pEmail = document.getElementById('mg-parent-email').value.trim().toLowerCase();
    const sEmail = document.getElementById('mg-student-email3').value.trim().toLowerCase();
    if(!pEmail || !sEmail) return;
    const { data: par } = await supabase.from('profiles').select('id').eq('email', pEmail).eq('role','parent').maybeSingle();
    const { data: stu } = await supabase.from('profiles').select('id').eq('email', sEmail).eq('role','student').maybeSingle();
    if(!par || !stu){ status('Check both emails — parent and student must already have accounts.'); return; }
    const { error } = await supabase.from('parent_links').insert({ parent_id: par.id, student_id: stu.id });
    status(error ? 'Already linked or error.' : 'Parent linked.'); render();
  };
}

/* =================================================================
   PARENT DASHBOARD
================================================================= */
function renderParent(){
  return `<div class="topbar"><div></div></div><div class="screen">
    <h2 style="font-size:20px; margin-bottom:4px;">Weekly Digest</h2>
    <div class="greet-mr" style="margin-bottom:14px;">Visibility into your child's progress — not granular daily control</div>
    ${parentChildren.length ? parentChildren.map(kid=>{
      const dg = parentDigests[kid.id] || { minutes:0, xp:0, daysActive:0, modules:0, newBadges:[] };
      return `<div class="card">
        <div style="font-weight:800; font-size:16px; margin-bottom:8px;">${escapeHtml(kid.name)}</div>
        <div class="stat-grid" style="margin:0 0 10px;">
          <div class="stat-card"><div class="n">${dg.minutes}</div><div class="l">Speaking minutes</div></div>
          <div class="stat-card"><div class="n">${dg.daysActive}</div><div class="l">Active days</div></div>
          <div class="stat-card"><div class="n">${dg.xp}</div><div class="l">XP this week</div></div>
          <div class="stat-card"><div class="n">${dg.modules}</div><div class="l">Modules touched</div></div>
        </div>
        ${dg.newBadges.length ? `<div style="font-weight:700; font-size:13px; margin-bottom:4px;">New milestones 🎉</div><div class="chip-row">${dg.newBadges.map(b=>`<span class="chip">${BADGE_DEFS.find(d=>d.key===b.badge_key)?.label || b.badge_key}</span>`).join('')}</div>` : ''}
        <div class="hint" style="margin-top:10px;">${dg.daysActive>=4 ? `${escapeHtml(kid.name)} had a strong week — a kind word at home goes a long way! 💛` : `A gentle nudge to practice a little each day helps a lot. 🌱`}</div>
      </div>`;
    }).join('') : `<div class="card"><div class="empty-note">No child linked to your account yet — ask your institute Admin to link your account to your child's email.</div></div>`}
  </div>`;
}

/* =================================================================
   GLOBAL HANDLER ATTACH
================================================================= */
function attachHandlers(){
  if(screen==='landing'){ attachLandingHandlers(); return; }
  if(screen==='auth'){ attachAuthHandlers(); return; }
  if(screen==='emailcheck'){ const b=document.getElementById('ec-login'); if(b) b.onclick=()=>{ authMode='login'; screen='auth'; render(); }; return; }
  if(screen==='onboarding'){ attachOnboardingHandlers(); return; }
  if(screen==='diagnostic'){ attachDiagnosticHandlers(); return; }

  document.querySelectorAll('[data-nav]').forEach(b=> b.onclick = async ()=>{
    screen=b.dataset.nav;
    if(screen==='leaderboard') await loadLeaderboard();
    if(screen==='mentor'){ mentorSelected=null; await loadMentorData(); }
    if(screen==='admin' || screen==='adminManage') await loadAdminData();
    if(screen==='parent') await loadParentData();
    render();
  });
  document.querySelectorAll('[data-open-module]').forEach(b=> b.onclick = ()=> openModule(b.dataset.openModule));

  if(screen==='lesson'){
    const closeBtn = document.getElementById('lesson-close');
    if(closeBtn) closeBtn.onclick = ()=>{ if(m6Timer) stopM6(); screen='home'; render(); };
    if(activeModuleKey==='m1') attachM1();
    else if(activeModuleKey==='m2') attachM2();
    else if(activeModuleKey==='m3') attachM3();
    else if(activeModuleKey==='m4') attachM4();
    else if(activeModuleKey==='m5') attachM5();
    else if(activeModuleKey==='m6') attachM6();
    else if(activeModuleKey==='m7') attachM7();
    else if(activeModuleKey==='m8') attachM8();
    else if(activeModuleKey==='complete'){ const b=document.getElementById('complete-home'); if(b) b.onclick=()=>{ screen='home'; render(); }; }
  }
  if(screen==='profile'){ const logoutBtn = document.getElementById('do-logout'); if(logoutBtn) logoutBtn.onclick = ()=> handleLogout(); }
  if(screen==='mentor') attachMentorHandlers();
  if(screen==='adminManage') attachAdminManageHandlers();
}

boot();
</script>
